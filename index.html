<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TexMap | MVP App</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        app: {
                            bg: '#09090b',       // Zinc 950
                            surface: '#18181b',  // Zinc 900
                            card: '#27272a',     // Zinc 800
                            border: '#3f3f46',   // Zinc 700
                            primary: '#10b981',  // Emerald 500 (Mint Accent)
                            primaryHover: '#059669',
                            text: '#f4f4f5',     // Zinc 50
                            muted: '#a1a1aa'     // Zinc 400
                        }
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(16, 185, 129, 0.15)',
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { color-scheme: dark; }
        body {
            background-color: #09090b;
            color: #f4f4f5;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile */
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* App Layout Architecture */
        #app-wrapper {
            display: flex;
            flex-direction: column;
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
            overflow: hidden;
        }
        .main-content {
            flex: 1;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        /* Tab Switching Logic */
        .tab-view {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
        }
        .tab-view.active {
            display: block;
            opacity: 1;
            z-index: 10;
        }
        .tab-view.scrollable { overflow-y: auto; padding-bottom: 90px; } /* Space for nav */

        /* Leaflet Map Overrides for Dark Mode & Mobile */
        .leaflet-container {
            background: #18181b !important;
            font-family: 'Inter', sans-serif;
            height: 100%;
            width: 100%;
        }
        .leaflet-control-zoom a {
            background-color: #27272a !important;
            color: #f4f4f5 !important;
            border-color: #3f3f46 !important;
        }
        .leaflet-control-attribution { display: none !important; } /* Cleaner mobile UI */
        
        /* Custom Map Pin */
        .custom-pin-wrapper {
            background: #10b981;
            border: 3px solid #09090b;
            border-radius: 50%;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .custom-pin-wrapper svg { width: 16px; height: 16px; color: #09090b; }
        .leaflet-marker-icon.active-pin .custom-pin-wrapper {
            transform: scale(1.25);
            background: #f4f4f5;
            border-color: #10b981;
        }
        .leaflet-marker-icon.active-pin .custom-pin-wrapper svg { color: #10b981; }

        /* Smooth Bottom Drawer */
        #map-drawer {
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }
    </style>
</head>
<body class="antialiased w-full max-w-md mx-auto sm:border-x sm:border-app-border relative shadow-2xl">

    <div id="app-wrapper">
        <header class="flex-none z-50 bg-app-surface/90 backdrop-blur-xl border-b border-app-border px-5 py-3.5 flex justify-between items-center pb-[env(safe-area-inset-top)]">
            <div class="flex flex-col">
                <span class="text-[10px] uppercase tracking-widest text-app-primary font-bold mb-0.5">Fabric Grid</span>
                <h1 class="text-xl font-extrabold leading-none tracking-tight text-white" id="header-title">Map</h1>
            </div>
            <div class="flex items-center gap-1.5 bg-app-card px-3 py-1.5 rounded-full border border-app-border shadow-inner">
                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-app-primary"></i>
                <span class="text-xs font-semibold text-app-text">Panabo City</span>
            </div>
        </header>

        <main class="main-content bg-app-bg">
            
            <section id="view-map" class="tab-view active">
                
                <div class="absolute top-4 left-0 w-full z-[400] px-4 pointer-events-none">
                    <div class="flex gap-2.5 overflow-x-auto no-scrollbar pointer-events-auto pb-2" id="map-filters">
                        <button onclick="filterMap('all', this)" class="shrink-0 rounded-full px-5 py-2 text-xs font-bold transition-all bg-app-primary text-app-bg shadow-[0_0_15px_rgba(16,185,129,0.3)] border border-app-primary">All Spots</button>
                        <button onclick="filterMap('tailor', this)" class="shrink-0 rounded-full px-5 py-2 text-xs font-semibold transition-all bg-app-surface/90 backdrop-blur text-app-muted border border-app-border hover:text-white">Tailors</button>
                        <button onclick="filterMap('laundry', this)" class="shrink-0 rounded-full px-5 py-2 text-xs font-semibold transition-all bg-app-surface/90 backdrop-blur text-app-muted border border-app-border hover:text-white">Laundry</button>
                    </div>
                </div>

                <div id="leaflet-map" class="absolute inset-0 w-full h-full z-0"></div>

                <div class="absolute bottom-6 left-4 right-4 z-[400] pointer-events-none overflow-hidden">
                    <div id="map-drawer" class="bg-app-surface/95 backdrop-blur-xl rounded-[1.5rem] border border-app-border p-5 transform translate-y-[150%] pointer-events-auto shadow-2xl">
                        </div>
                </div>
            </section>

            <section id="view-market" class="tab-view scrollable px-4 py-6">
                <div class="relative mb-6">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-app-muted"></i>
                    <input type="text" placeholder="Search uniforms, pageant wear..." class="w-full bg-app-surface border border-app-border rounded-2xl py-3.5 pl-11 pr-4 text-sm text-white placeholder-app-muted focus:outline-none focus:border-app-primary transition-colors shadow-inner">
                </div>

                <h2 class="text-lg font-bold text-white mb-4 tracking-tight flex items-center gap-2">
                    <i data-lucide="sparkles" class="w-4 h-4 text-app-primary"></i> Local Exchange
                </h2>

                <div class="grid grid-cols-2 gap-3.5" id="market-grid">
                    </div>
            </section>

            <section id="view-profile" class="tab-view scrollable px-4 py-6">
                
                <div class="bg-app-surface rounded-[1.5rem] p-5 border border-app-border relative overflow-hidden shadow-glow mb-6">
                    <div class="absolute -top-10 -right-10 w-32 h-32 bg-app-primary/10 rounded-full blur-2xl pointer-events-none"></div>
                    
                    <div class="flex items-center gap-4 relative z-10">
                        <div class="w-16 h-16 bg-app-card rounded-full border-2 border-app-primary flex items-center justify-center text-white font-black text-xl shadow-lg">
                            PM
                        </div>
                        <div class="flex-1">
                            <h2 class="text-xl font-extrabold text-white leading-tight">Project Manager</h2>
                            <p class="text-sm text-app-muted font-medium mb-1.5">DNSC • <span class="text-app-primary font-bold">BSIT</span></p>
                            <span class="inline-flex items-center gap-1 text-[9px] font-bold uppercase tracking-widest text-app-bg bg-app-primary px-2 py-0.5 rounded-sm">
                                <i data-lucide="shield-check" class="w-3 h-3"></i> Verified User
                            </span>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2 border-t border-app-border mt-5 pt-4">
                        <div class="text-center">
                            <p class="text-lg font-bold text-white">4</p>
                            <p class="text-[10px] text-app-muted uppercase tracking-wider font-semibold">Listings</p>
                        </div>
                        <div class="text-center border-l border-app-border">
                            <p class="text-lg font-bold text-white">12</p>
                            <p class="text-[10px] text-app-muted uppercase tracking-wider font-semibold">Sold</p>
                        </div>
                        <div class="text-center border-l border-app-border">
                            <p class="text-lg font-bold text-app-primary">4.9</p>
                            <p class="text-[10px] text-app-muted uppercase tracking-wider font-semibold">Rating</p>
                        </div>
                    </div>
                </div>

                <div class="flex gap-4 border-b border-app-border mb-5 px-1">
                    <button class="pb-3 text-sm font-bold text-app-primary border-b-2 border-app-primary transition-colors flex items-center gap-2">
                        <i data-lucide="package" class="w-4 h-4"></i> My Listings
                    </button>
                    <button class="pb-3 text-sm font-semibold text-app-muted hover:text-white transition-colors flex items-center gap-2">
                        <i data-lucide="heart" class="w-4 h-4"></i> Favorites
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-3.5" id="profile-listings-grid">
                    </div>

            </section>
        </main>

        <nav class="flex-none fixed bottom-0 left-0 w-full z-[500] bg-app-surface/90 backdrop-blur-xl border-t border-app-border pb-[env(safe-area-inset-bottom)] sm:absolute">
            <div class="flex justify-around items-center px-2 pt-2 pb-3">
                <button onclick="switchTab('map', 'Service Map', this)" class="nav-btn text-app-primary flex flex-col items-center gap-1 w-20 transition-all duration-200">
                    <div class="p-1.5 rounded-full bg-app-primary/10"><i data-lucide="map" class="w-5 h-5"></i></div>
                    <span class="text-[10px] font-bold tracking-wide">Map</span>
                </button>
                <button onclick="switchTab('market', 'Marketplace', this)" class="nav-btn text-app-muted hover:text-white flex flex-col items-center gap-1 w-20 transition-all duration-200">
                    <div class="p-1.5 rounded-full bg-transparent"><i data-lucide="shopping-bag" class="w-5 h-5"></i></div>
                    <span class="text-[10px] font-semibold tracking-wide">Market</span>
                </button>
                <button onclick="switchTab('profile', 'User Dashboard', this)" class="nav-btn text-app-muted hover:text-white flex flex-col items-center gap-1 w-20 transition-all duration-200">
                    <div class="p-1.5 rounded-full bg-transparent"><i data-lucide="user" class="w-5 h-5"></i></div>
                    <span class="text-[10px] font-semibold tracking-wide">Profile</span>
                </button>
            </div>
        </nav>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- 1. DATA MODEL ---
        const AppData = {
            map: null,
            markers: [],
            activePinId: null,
            vendors: [
                { id: 1, name: "Stitch Master", type: "tailor", lat: 7.3082, lng: 125.6845, rating: "4.9", address: "Panabo City Center", desc: "Expert uniform alterations, custom sizing, and quick campus repairs.", icon: "scissors" },
                { id: 2, name: "Fresh Fold Laundry", type: "laundry", lat: 7.3105, lng: 125.6810, rating: "4.7", address: "Near DNSC Campus", desc: "Same-day eco-friendly washing and ironing. Student discounts available.", icon: "shirt" },
                { id: 3, name: "Glamour Rentals", type: "tailor", lat: 7.3050, lng: 125.6880, rating: "5.0", address: "National Highway", desc: "High-quality gowns, barongs, and formal wear for defenses and pageants.", icon: "sparkles" }
            ],
            marketItems: [
                { id: 101, title: "Maritime Cadet Uniform", price: "₱800", type: "Buy", status: "M | GOOD", img: "https://images.unsplash.com/photo-1595341888016-a392ef81b7de?auto=format&fit=crop&q=80&w=400", isRent: false, seller: "Gabriel R." },
                { id: 102, title: "Tailored Linen Blazer", price: "₱280", type: "/day", status: "L | LIKE NEW", img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&q=80&w=400", isRent: true, seller: "Stitch Master" },
                { id: 103, title: "Red Pageant Gown", price: "₱1,200", type: "/day", status: "CUSTOM", img: "https://images.unsplash.com/photo-1566160980280-992a6b2ea828?auto=format&fit=crop&q=80&w=400", isRent: true, seller: "Glamour Rentals" },
                { id: 104, title: "BSIT Dept. Polo Uniform", price: "₱250", type: "Buy", status: "S | FAIR", img: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&q=80&w=400", isRent: false, seller: "John Wyne" }
            ],
            userListings: [
                { id: 201, title: "DNSC PE Uniform Set", price: "₱350", type: "Buy", status: "M | GOOD", img: "https://images.unsplash.com/photo-1489987707023-afc82478163c?auto=format&fit=crop&q=80&w=400", isRent: false },
                { id: 202, title: "Black Formal Slacks", price: "₱200", type: "Buy", status: "W30 | FAIR", img: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&q=80&w=400", isRent: false }
            ]
        };

        // --- 2. INITIALIZATION ---
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            initMap();
            renderGrid('market-grid', AppData.marketItems);
            renderGrid('profile-listings-grid', AppData.userListings);
        });

        // --- 3. UI LOGIC: TAB SWITCHING ---
        function switchTab(tabId, title, btnElement) {
            document.getElementById('header-title').innerText = title;
            
            // Hide all tabs
            document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
            
            // Reset Nav styling
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-app-primary');
                btn.classList.add('text-app-muted');
                btn.querySelector('div').classList.remove('bg-app-primary/10');
                btn.querySelector('div').classList.add('bg-transparent');
                btn.querySelector('span').classList.remove('font-bold');
                btn.querySelector('span').classList.add('font-semibold');
            });
            
            // Activate new tab & nav button
            document.getElementById(`view-${tabId}`).classList.add('active');
            btnElement.classList.remove('text-app-muted');
            btnElement.classList.add('text-app-primary');
            btnElement.querySelector('div').classList.remove('bg-transparent');
            btnElement.querySelector('div').classList.add('bg-app-primary/10');
            btnElement.querySelector('span').classList.remove('font-semibold');
            btnElement.querySelector('span').classList.add('font-bold');

            // CRITICAL: Fix Leaflet sizing issue on mobile when returning to the map tab
            if (tabId === 'map' && AppData.map) {
                setTimeout(() => {
                    AppData.map.invalidateSize();
                }, 250); // Wait for CSS transition to complete
            }
        }

        // --- 4. MAP LOGIC ---
        function initMap() {
            // Initialize specifically for mobile
            AppData.map = L.map('leaflet-map', {
                zoomControl: false, // Move zoom control for mobile
                tap: false,         // Fixes ghost clicks in some mobile browsers
                attributionControl: false
            }).setView([7.3082, 125.6845], 15);

            // Add standard bottom-right zoom control
            L.control.zoom({ position: 'bottomright' }).addTo(AppData.map);

            // CartoDB Dark Matter tiles (Perfect for dark mode)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(AppData.map);

            renderPins(AppData.vendors);
        }

        function createPinIcon(vendor, isActive) {
            const iconHtml = `<i data-lucide="${vendor.icon}"></i>`;
            return L.divIcon({
                className: `custom-marker ${isActive ? 'active-pin' : ''}`,
                html: `<div class="custom-pin-wrapper">${iconHtml}</div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 32]
            });
        }

        function renderPins(vendors) {
            AppData.markers.forEach(m => AppData.map.removeLayer(m));
            AppData.markers = [];

            vendors.forEach(vendor => {
                const marker = L.marker([vendor.lat, vendor.lng], { 
                    icon: createPinIcon(vendor, false) 
                }).addTo(AppData.map);
                
                marker.vendorId = vendor.id;
                marker.on('click', () => selectVendor(vendor, marker));
                AppData.markers.push(marker);
            });
            
            // Re-initialize icons inside the new DOM elements
            setTimeout(() => lucide.createIcons(), 10);
        }

        function filterMap(type, btnElement) {
            // Update filter pill UI
            document.querySelectorAll('#map-filters button').forEach(btn => {
                btn.className = "shrink-0 rounded-full px-5 py-2 text-xs font-semibold transition-all bg-app-surface/90 backdrop-blur text-app-muted border border-app-border hover:text-white";
            });
            btnElement.className = "shrink-0 rounded-full px-5 py-2 text-xs font-bold transition-all bg-app-primary text-app-bg shadow-[0_0_15px_rgba(16,185,129,0.3)] border border-app-primary";

            // Dismiss drawer
            document.getElementById('map-drawer').classList.add('translate-y-[150%]');
            AppData.activePinId = null;

            if (type === 'all') {
                renderPins(AppData.vendors);
                AppData.map.flyTo([7.3082, 125.6845], 15, { duration: 1 });
            } else {
                const filtered = AppData.vendors.filter(v => v.type === type);
                renderPins(filtered);
                if (filtered.length > 0) {
                    AppData.map.flyTo([filtered[0].lat, filtered[0].lng], 16, { duration: 1 });
                }
            }
        }

        function selectVendor(vendor, currentMarker) {
            AppData.activePinId = vendor.id;
            
            // Update pin styles
            AppData.markers.forEach(m => {
                const v = AppData.vendors.find(x => x.id === m.vendorId);
                m.setIcon(createPinIcon(v, m.vendorId === vendor.id));
            });
            lucide.createIcons();

            // Populate and show drawer
            const drawer = document.getElementById('map-drawer');
            drawer.innerHTML = `
                <div class="w-12 h-1 bg-app-border rounded-full mx-auto mb-5"></div>
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <h3 class="text-xl font-bold text-white leading-none mb-1.5 tracking-tight">${vendor.name}</h3>
                        <p class="text-[10px] text-app-primary font-bold uppercase tracking-widest">${vendor.type} • ${vendor.address}</p>
                    </div>
                    <div class="flex items-center gap-1 bg-app-card px-2 py-1 rounded border border-app-border">
                        <i data-lucide="star" class="text-amber-400 w-3 h-3 fill-current"></i>
                        <span class="text-xs font-bold text-white">${vendor.rating}</span>
                    </div>
                </div>
                <p class="text-sm text-app-muted leading-relaxed mb-5">${vendor.desc}</p>
                <div class="flex gap-3">
                    <button class="flex-1 bg-app-card text-white py-3.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 hover:bg-app-border transition-colors border border-app-border shadow-sm">
                        <i data-lucide="message-square" class="w-4 h-4 text-app-muted"></i> Chat
                    </button>
                    <button class="flex-1 bg-app-primary text-app-bg py-3.5 rounded-xl font-bold text-sm flex items-center justify-center hover:opacity-90 transition-opacity shadow-lg shadow-app-primary/20">
                        Book Service
                    </button>
                </div>
            `;
            lucide.createIcons();
            drawer.classList.remove('translate-y-[150%]');
            
            // Pan map down slightly so marker is visible above the drawer on small screens
            AppData.map.panTo([vendor.lat - 0.004, vendor.lng], { animate: true, duration: 0.5 }); 
        }

        // --- 5. GRID RENDERING (Market & Profile) ---
        function renderGrid(containerId, items) {
            const grid = document.getElementById(containerId);
            grid.innerHTML = '';
            
            items.forEach(item => {
                const actionText = item.isRent ? 'Reserve' : 'Buy Now';
                grid.innerHTML += `
                    <div class="bg-app-surface rounded-[1.25rem] p-2 border border-app-border flex flex-col h-full shadow-sm">
                        <div class="relative w-full aspect-[4/5] rounded-xl overflow-hidden bg-app-card mb-3">
                            <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover">
                            <div class="absolute top-2 left-2 bg-app-bg/80 backdrop-blur-md text-white font-bold text-[9px] px-2 py-1 rounded-lg border border-app-border uppercase tracking-widest">
                                ${item.status}
                            </div>
                        </div>
                        <div class="px-1 flex flex-col flex-1 pb-1">
                            <h3 class="font-semibold text-white text-xs leading-snug mb-1 line-clamp-2">${item.title}</h3>
                            <div class="text-app-primary font-bold text-sm mb-3 mt-auto">
                                ${item.price} <span class="text-[9px] text-app-muted font-medium uppercase tracking-widest">${item.type}</span>
                            </div>
                            <button class="w-full bg-app-card border border-app-border hover:bg-app-primary hover:text-app-bg hover:border-app-primary text-white py-2.5 rounded-xl font-bold text-xs transition-all mt-auto shadow-sm">
                                ${actionText}
                            </button>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
